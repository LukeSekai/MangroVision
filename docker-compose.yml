name: mangrovision-local

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: mangrovision
      POSTGRES_USER: mangrovision_owner
      POSTGRES_PASSWORD: mangrovision_owner
    ports:
      - "5432:5432"
    volumes:
      - mangrovision_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangrovision_owner -d mangrovision"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-test:
    profiles: ["test"]
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: mangrovision_test
      POSTGRES_USER: mangrovision_owner
      POSTGRES_PASSWORD: mangrovision_owner
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangrovision_owner -d mangrovision_test"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mangrovision
      MINIO_ROOT_PASSWORD: replace-with-a-long-random-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mangrovision_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 mangrovision replace-with-a-long-random-secret
        && mc mb --ignore-existing local/analysis-images
        && mc anonymous set none local/analysis-images

volumes:
  mangrovision_postgres_data:
  mangrovision_minio_data:
